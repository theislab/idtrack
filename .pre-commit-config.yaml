repos:
    - repo: local
      hooks:
          - id: black
            name: black
            entry: black
            language: system
            types: [python]
            require_serial: true
          - id: isort
            name: isort (python)
            entry: isort
            language: system
            types: [python]
          - id: isort
            name: isort (pyi)
            types: [pyi]
            entry: isort
            language: system
          - id: check-added-large-files
            name: Check for added large files
            entry: check-added-large-files
            language: system
          - id: check-toml
            name: Check Toml
            entry: check-toml
            language: system
            types: [toml]
          - id: check-yaml
            name: Check Yaml
            entry: check-yaml
            language: system
            types: [yaml]
          - id: end-of-file-fixer
            name: Fix End of Files
            entry: end-of-file-fixer
            language: system
            types: [text]
            stages: [pre-commit, pre-push, manual]
            exclude: docs/
          - id: flake8
            name: flake8
            entry: flake8
            language: system
            types: [python]
            require_serial: true
          - id: pyupgrade
            name: pyupgrade
            description: Automatically upgrade syntax for newer versions.
            entry: pyupgrade
            language: system
            types: [python]
            args: [--py312-plus]
          - id: trailing-whitespace
            name: Trim Trailing Whitespace
            entry: trailing-whitespace-fixer
            language: system
            types: [text]
            stages: [pre-commit, pre-push, manual]
    # The maintained mirror of prettier (pre-commit/mirrors-prettier is archived and stopped at prettier 2.x).
    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.10.1
      hooks:
          - id: prettier
            # Test data are written by scripts, not by hand (tests/data/real/*: expected answers).
            exclude: ^tests/data/
