# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# The OS, the Python version and the tools of the build
build:
    os: ubuntu-22.04
    apt_packages:
        - pandoc
    tools:
        python: "3.12"

# Build documentation in the docs/ directory with Sphinx
sphinx:
    configuration: docs/conf.py

# HTML only (no PDF or ePub)
formats: []

# The package with its `harmonize` extra (docs/conf.py reads the version from its installed metadata, and autodoc
# imports every module), then the documentation's own tools.
python:
    install:
        - method: pip
          path: .
          extra_requirements:
              - harmonize
        - requirements: docs/requirements.txt
