# Release: Build and publish to PyPI when a GitHub Release is published.
#
# Publishing uses the repository secret `PYPI_TOKEN` (an API token of the PyPI project with upload permission), as
# every release so far did. A release whose version exists on PyPI already fails: a version is published once.
# PyPI's trusted publishing (OpenID Connect, no stored token) can replace the token once the PyPI project lists this
# repository and this workflow file as a trusted publisher (PyPI: project settings, "Publishing").
name: Publish idtrack to PyPI

on:
    release:
        types: [published]

# Default permissions for the GITHUB_TOKEN (principle of least privilege).
permissions:
    contents: read

jobs:
    release:
        name: Build & publish
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7
              with:
                  # Fetch tags/history so version checks can be done reliably.
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      poetry.lock

            # Guardrail: ensure the GitHub Release tag matches pyproject.toml's version.
            - name: Verify release tag matches package version
              shell: python
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  import os
                  import re
                  import sys
                  import tomllib
                  from pathlib import Path

                  tag = os.environ["RELEASE_TAG"].strip()
                  match = re.search(r"(\d+\.\d+\.\d+(?:[a-zA-Z0-9.\-]*)?)", tag)
                  if not match:
                      raise SystemExit(f"Could not parse a version from release tag: {tag!r}")

                  tag_version = match.group(1)
                  pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
                  project_version = pyproject["project"]["version"]

                  if project_version != tag_version:
                      raise SystemExit(
                          f"pyproject.toml version ({project_version}) does not match release tag ({tag}). "
                          "Refuse to publish."
                      )

                  print(f"Publishing version {project_version} (tag {tag})")

            - name: Upgrade pip and install build tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade build twine

            # Build both sdist and wheel into dist/.
            - name: Build package
              run: python -m build

            # Validate long_description rendering and core metadata before publishing.
            - name: Check package metadata (twine)
              run: python -m twine check --strict dist/*

            # Upload dist/* to PyPI with the project's API token (attestations need trusted publishing: off).
            - name: Publish package on PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_TOKEN }}
                  packages-dir: dist
                  attestations: false
                  verbose: true
