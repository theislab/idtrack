# CI: Build documentation and (optionally) deploy it to GitHub Pages.
#
# Why two jobs?
# - `build`: read-only permissions, runs on PRs to catch docs regressions.
# - `deploy`: write permissions, runs only on pushes to main/master.
name: Build Documentation

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

# Default permissions for the GITHUB_TOKEN (principle of least privilege).
permissions:
    contents: read

# Cancel older runs for the same branch/PR to reduce CI queue time and avoid wasting minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build docs
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        steps:
            - name: Check out source-code repository
              uses: actions/checkout@v4

            # nbsphinx/nbconvert uses the pandoc CLI for some conversions.
            - name: Install pandoc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip
                  cache-dependency-path: |
                      docs/requirements.txt

            - name: Upgrade pip
              run: python -m pip install --upgrade pip

            - name: Install doc dependencies
              run: python -m pip install -r docs/requirements.txt

            - name: Build docs (Sphinx HTML)
              run: |
                  cd docs
                  make html

            # Upload the rendered site so the deploy job can publish without rebuilding.
            - name: Upload built docs
              uses: actions/upload-artifact@v4
              with:
                  name: docs-html
                  path: docs/_build/html

    deploy:
        name: Deploy docs
        needs: build
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        # Only deploy from the default branches (never from PR refs).
        # This also allows a manual `workflow_dispatch` on main/master to redeploy.
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

        # This job needs write access to push to the `gh-pages` branch.
        permissions:
            contents: write

        steps:
            - name: Download built docs
              uses: actions/download-artifact@v4
              with:
                  name: docs-html
                  path: docs/_build/html

            - name: Deploy to GitHub Pages (gh-pages branch)
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/_build/html
