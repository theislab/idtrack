# CI: Run the project's Nox sessions (tests, linting, typing, docs).
#
# Design goals:
# - Parallelism: each (session, python) pair is a separate matrix job.
# - Reproducibility: pin action major versions and runner images where practical.
# - Robustness: avoid doing expensive system setup (apt) unless a job needs it.
# - Least privilege: keep the default GITHUB_TOKEN permissions read-only.
name: Run idtrack Tests

on:
    push:
    pull_request:
    workflow_dispatch:

# Default permissions for the GITHUB_TOKEN.
# Most CI jobs only need to read the repository contents.
permissions:
    contents: read

# Cancel older runs for the same branch/PR to reduce CI queue time and avoid wasting minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        # This name shows up in the GitHub UI for each matrix element.
        name: ${{ matrix.session }} (py${{ matrix.python-version }})
        runs-on: ubuntu-22.04
        timeout-minutes: 45
        strategy:
            # Do not cancel the whole matrix if a single entry fails.
            # This keeps signal for other Python versions/sessions.
            fail-fast: false
            matrix:
                include:
                    # Keep "tooling" sessions on a single Python for speed: the oldest supported one, so that type
                    # checks and doctests catch any use of a newer Python's features (keep in sync with noxfile.py).
                    - { python-version: "3.12", session: "pre-commit" }
                    - { python-version: "3.12", session: "pip-audit" }
                    - { python-version: "3.12", session: "mypy" }
                    # Run the full test suite across the supported Python versions.
                    - { python-version: "3.12", session: "tests" }
                    - { python-version: "3.13", session: "tests" }
                    - { python-version: "3.14", session: "tests" }
                    - { python-version: "3.15", session: "tests" }
                    - { python-version: "3.12", session: "typeguard" }
                    - { python-version: "3.12", session: "xdoctest" }
                    # Documentation build (kept as a separate session for clear failures).
                    - { python-version: "3.12", session: "docs-build" }

        steps:
            # Checkout is required for Nox to install the local package and for
            # tools like pre-commit and mypy to see the repo content.
            - name: Check out the repository
              uses: actions/checkout@v7

            # Install the Python interpreter for this matrix element.
            # We also enable pip caching to speed up dependency downloads.
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      poetry.lock
                      .pre-commit-config.yaml

            # pandoc is only required for docs builds (nbsphinx/nbconvert).
            - name: Install pandoc (docs only)
              if: matrix.session == 'docs-build'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc

            # h5py has no wheels for Python 3.15 yet (h5py 3.16.0, November 2026), so pip builds it from source. It is
            # built against the HDF5 that the h5py wheels of the other Python versions bundle (h5py 3.16.0: HDF5 2.0.0;
            # update both together), not ubuntu-22.04's libhdf5-dev (1.10, which cannot read caches that idtrack 0.0.5
            # wrote with the HDF5 1.14 of its wheels), so that this job tests the same library as the others. Remove
            # these steps once h5py publishes cp315 wheels.
            - name: Restore the HDF5 build (Python 3.15 only)
              if: matrix.python-version == '3.15'
              uses: actions/cache@v6
              with:
                  path: ~/hdf5-2.0.0
                  key: hdf5-2.0.0-${{ runner.os }}-ubuntu-22.04-${{ hashFiles('.github/scripts/build_hdf5.sh') }}

            - name: Build HDF5 2.0.0 (Python 3.15 only)
              if: matrix.python-version == '3.15'
              run: bash .github/scripts/build_hdf5.sh 2.0.0 "$HOME/hdf5-2.0.0"

            # Poetry, its export plugin, nox and nox-poetry are installed at the versions of poetry.lock.
            - name: Read the tool versions from poetry.lock
              shell: python
              run: |
                  import os
                  import tomllib

                  with open("poetry.lock", "rb") as fh:
                      versions = {package["name"]: package["version"] for package in tomllib.load(fh)["package"]}
                  with open(os.environ["GITHUB_ENV"], "a") as env:
                      for name in ("poetry", "poetry-plugin-export", "nox", "nox-poetry"):
                          env.write(f"{name.upper().replace('-', '_')}_VERSION={versions[name]}\n")
                          print(name, versions[name])

            # Install Poetry (used by the nox-poetry plugin and the pip-audit session).
            - name: Install Poetry
              run: |
                  pipx install "poetry==$POETRY_VERSION"
                  pipx inject poetry "poetry-plugin-export==$POETRY_PLUGIN_EXPORT_VERSION"
                  poetry --version

            # Install Nox + its Poetry integration.
            - name: Install nox and nox-poetry
              run: |
                  pipx install "nox==$NOX_VERSION"
                  pipx inject nox "nox-poetry==$NOX_POETRY_VERSION"
                  nox --version

            # pre-commit downloads hooks into ~/.cache/pre-commit.
            # Caching that directory speeds up repeated CI runs.
            - name: Compute pre-commit cache key
              if: matrix.session == 'pre-commit'
              id: pre-commit-cache
              shell: python
              env: # pass runner.os into Python
                  RUNNER_OS: ${{ runner.os }}
              run: |
                  import hashlib
                  import os
                  import sys

                  python_ver = f"py{sys.version_info[0]}.{sys.version_info[1]}"
                  payload = sys.version.encode() + sys.executable.encode()
                  digest = hashlib.sha256(payload).hexdigest()
                  result = f"{os.environ['RUNNER_OS']}-{python_ver}-{digest[:8]}-pre-commit"

                  # write the output for downstream steps
                  with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                      fh.write(f"result={result}\n")

            - name: Restore pre-commit cache
              uses: actions/cache@v6
              if: matrix.session == 'pre-commit'
              with:
                  path: ~/.cache/pre-commit
                  key: ${{ steps.pre-commit-cache.outputs.result }}-${{ hashFiles('.pre-commit-config.yaml') }}
                  restore-keys: |
                      ${{ steps.pre-commit-cache.outputs.result }}-

            # Run the requested Nox session for this matrix entry.
            # NOTE: We pass --python to force Nox to use the interpreter we just set up.
            - name: Run Nox
              run: |
                  nox --force-color --python=${{ matrix.python-version }} --session=${{ matrix.session }}

            - name: Show coverage files
              if: always() && matrix.session == 'tests' && matrix.python-version == '3.12'
              run: ls -alh .coverage*

            - name: Upload coverage data
              if: always() && matrix.session == 'tests' && matrix.python-version == '3.12'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-data
                  path: .coverage*
                  include-hidden-files: true

            - name: Upload documentation
              if: matrix.session == 'docs-build'
              uses: actions/upload-artifact@v7
              with:
                  name: docs
                  path: docs/_build

    coverage:
        # Runs after the tests even when other entries of the matrix failed, so that the coverage of the default
        # Python is reported; it fails when that entry left no coverage data.
        if: ${{ always() }}
        runs-on: ubuntu-22.04
        needs: tests
        timeout-minutes: 30
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Set up Python 3.12
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      poetry.lock

            # Poetry, its export plugin, nox and nox-poetry are installed at the versions of poetry.lock.
            - name: Read the tool versions from poetry.lock
              shell: python
              run: |
                  import os
                  import tomllib

                  with open("poetry.lock", "rb") as fh:
                      versions = {package["name"]: package["version"] for package in tomllib.load(fh)["package"]}
                  with open(os.environ["GITHUB_ENV"], "a") as env:
                      for name in ("poetry", "poetry-plugin-export", "nox", "nox-poetry"):
                          env.write(f"{name.upper().replace('-', '_')}_VERSION={versions[name]}\n")
                          print(name, versions[name])

            - name: Install Poetry
              run: |
                  pipx install "poetry==$POETRY_VERSION"
                  pipx inject poetry "poetry-plugin-export==$POETRY_PLUGIN_EXPORT_VERSION"
                  poetry --version

            - name: Install nox and nox-poetry
              run: |
                  pipx install "nox==$NOX_VERSION"
                  pipx inject nox "nox-poetry==$NOX_POETRY_VERSION"
                  nox --version

            # The coverage data of the tests on the default Python. A missing artifact (that entry failed or was
            # cancelled before its upload) fails this job: the coverage gate is never passed without data.
            - name: Download coverage data
              uses: actions/download-artifact@v8
              with:
                  name: coverage-data

            - name: Combine coverage data and display human readable report
              run: nox --force-color --session=coverage

            - name: Create coverage report
              run: nox --force-color --session=coverage -- xml -i

            - name: Upload coverage report
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml
                  fail_ci_if_error: false
