# CI: Build distributions and sanity-check packaging metadata.
#
# Notes:
# - Uses a matrix so each (os, python) pair is a separate job => parallelism.
# - Uses `python -m build` (PEP 517) instead of installing Poetry in CI to reduce toolchain fragility.
# - Installs the wheel with `--no-deps` to avoid downloading heavy scientific stacks on all platforms.
# - `test-wheel` then installs the wheel built on Linux with its dependencies, on every supported Python, with and
#   without the `harmonize` extra, and runs the unit suite against the installed package (.github/scripts/test_wheel.sh).
name: Build idtrack Package

on:
    push:
    pull_request:
    workflow_dispatch:

# Default permissions for the GITHUB_TOKEN (principle of least privilege).
permissions:
    contents: read

# Cancel older runs for the same branch/PR to reduce CI queue time and avoid wasting minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build (${{ matrix.os }} / py${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        # Support `[skip ci]`/`[ci skip]` in both commit messages (push) and PR titles (pull_request).
        if: >-
            !contains(github.event.head_commit.message || github.event.pull_request.title || '', '[skip ci]') &&
            !contains(github.event.head_commit.message || github.event.pull_request.title || '', '[ci skip]')
        strategy:
            # Do not cancel the whole matrix if a single entry fails.
            fail-fast: false
            matrix:
                # Pin runner images to reduce surprise breakage when `*-latest` moves. GitHub retires images
                # (macos-14 is no longer offered); check GitHub's list of hosted runner labels when a job cannot start.
                os: [ubuntu-22.04, macos-15, windows-2022]
                python-version: ["3.12", "3.13", "3.14", "3.15"]

        # Use bash everywhere so globs like dist/*.whl behave consistently across OSes.
        defaults:
            run:
                shell: bash

        steps:
            - name: Check out source-code repository
              uses: actions/checkout@v7

            # Install the Python interpreter for this matrix element.
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      poetry.lock

            # Use PEP 517 builds via `build` (reads `pyproject.toml` build-system settings).
            - name: Upgrade pip and install build tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install --upgrade build twine

            # Build both sdist and wheel into dist/.
            - name: Build package (sdist + wheel)
              run: python -m build

            # Validate long_description rendering and core metadata.
            - name: Check package metadata (twine)
              run: python -m twine check --strict dist/*

            # Install the built wheel without dependencies to ensure the artifact is valid.
            # We print the installed version via importlib.metadata to avoid importing runtime deps.
            - name: Install wheel (no deps)
              run: |
                  python -m pip install --no-deps dist/*.whl
                  python -c "import importlib.metadata as m; print(m.version('idtrack'))"

            # The wheel is pure Python (py3-none-any): the one built on Linux with the oldest Python is the one tested.
            - name: Upload wheel
              if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
              uses: actions/upload-artifact@v7
              with:
                  name: wheel
                  path: dist/*.whl

    test-wheel:
        name: Test the installed wheel (py${{ matrix.python-version }}${{ matrix.extra && format(' / {0}', matrix.extra) || '' }})
        needs: build
        runs-on: ubuntu-22.04
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14", "3.15"]
                # "" is the plain install; the tests that need the extra's packages skip themselves there.
                extra: ["", "harmonize"]

        steps:
            # The tests, pyproject.toml (pytest's settings), poetry.lock (pytest's version) and the scripts.
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      poetry.lock

            # h5py has no wheels for Python 3.15 yet (h5py 3.16.0, November 2026), so pip builds it from source, against
            # the HDF5 that the h5py wheels of the other Python versions bundle (see run_tests.yml; update together).
            - name: Restore the HDF5 build (Python 3.15 only)
              if: matrix.python-version == '3.15'
              uses: actions/cache@v6
              with:
                  path: ~/hdf5-2.0.0
                  key: hdf5-2.0.0-${{ runner.os }}-ubuntu-22.04-${{ hashFiles('.github/scripts/build_hdf5.sh') }}

            - name: Build HDF5 2.0.0 (Python 3.15 only)
              if: matrix.python-version == '3.15'
              run: bash .github/scripts/build_hdf5.sh 2.0.0 "$HOME/hdf5-2.0.0"

            - name: Download wheel
              uses: actions/download-artifact@v8
              with:
                  name: wheel
                  path: dist

            - name: Install the wheel in a fresh virtual environment and run the unit suite against it
              env:
                  PYTHON: python
                  WORK_DIR: ${{ runner.temp }}/test-wheel
              run: bash .github/scripts/test_wheel.sh dist/*.whl "${{ matrix.extra }}"
