# CI: Build the documentation as Read the Docs builds it (from docs/requirements.txt, with `make html`), with every
# warning an error. The documentation is published by Read the Docs (https://idtrack.readthedocs.io/, .readthedocs.yml);
# this workflow publishes nothing.
name: Build Documentation

on:
    push:
        branches: [main, master]
    pull_request:
    workflow_dispatch:

# Default permissions for the GITHUB_TOKEN (principle of least privilege).
permissions:
    contents: read

# Cancel older runs for the same branch/PR to reduce CI queue time and avoid wasting minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build docs
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        steps:
            - name: Check out source-code repository
              uses: actions/checkout@v7

            # nbsphinx/nbconvert uses the pandoc CLI for some conversions.
            - name: Install pandoc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      docs/requirements.txt

            - name: Upgrade pip
              run: python -m pip install --upgrade pip

            # The package with its `harmonize` extra (docs/conf.py reads the version from its installed metadata, and
            # autodoc imports every module), then the documentation's own tools.
            - name: Install the package and the doc dependencies
              run: python -m pip install ".[harmonize]" -r docs/requirements.txt

            - name: Build docs (Sphinx HTML)
              run: |
                  cd docs
                  make html
