# CI: Dependency compatibility checks.
#
# This workflow builds a wheel once, then installs it against multiple
# "dependency stacks" using pip constraints. This is a cheap way to detect
# dependency resolver conflicts and missing upper/lower bounds.
#
# Parallelism:
# - The `install` job uses a matrix so each (python, constraint-set) pair runs
#   as a separate job => parallelism on GitHub runners.
name: Dependency Compatibility

on:
    push:
    pull_request:
    workflow_dispatch:

# Default permissions for the GITHUB_TOKEN (principle of least privilege).
permissions:
    contents: read

# Cancel older runs for the same branch/PR to reduce CI queue time and avoid wasting minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build-wheel:
        name: Build wheel
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      poetry.lock

            - name: Upgrade pip and install build tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build

            - name: Build wheel
              run: python -m build --wheel

            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                  name: wheel
                  path: dist/*.whl

    install:
        name: Install (${{ matrix.python-version }} / ${{ matrix.dependency-set }})
        needs: build-wheel
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        strategy:
            # Do not cancel the whole matrix if a single entry fails.
            fail-fast: false
            matrix:
                include:
                    # -------------------------------------------------------------------------
                    # Python 3.9 (oldest supported) – exercise both legacy and modern stacks.
                    # -------------------------------------------------------------------------
                    - python-version: "3.9"
                      dependency-set: "legacy stack (nx<3, yaml<6, pandas<2, numpy<2)"
                      constraints: |
                          numpy<2
                          pandas<2
                          scipy<1.12
                          sparse<0.15
                          anndata<0.10
                          networkx<3
                          PyYAML<6
                    - python-version: "3.9"
                      dependency-set: "legacy stack (nx>=3, yaml<6, pandas<2, numpy<2)"
                      constraints: |
                          numpy<2
                          pandas<2
                          scipy<1.12
                          sparse<0.15
                          anndata<0.10
                          networkx>=3,<4
                          PyYAML<6
                    - python-version: "3.9"
                      dependency-set: "pandas>=2 / numpy<2 (modern deps)"
                      constraints: |
                          numpy<2
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse<1
                          requests==2.32.4
                          urllib3==2.5.0
                    - python-version: "3.9"
                      dependency-set: "pandas>=2 / numpy>=2 (modern deps)"
                      constraints: |
                          numpy>=2,<3
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse>=0.15,<1
                          requests==2.32.4
                          urllib3==2.5.0

                    # -------------------------------------------------------------------------
                    # Python 3.10
                    # -------------------------------------------------------------------------
                    # NOTE: PyYAML 5.x does not ship manylinux wheels for Python 3.10+ and its sdist build fails
                    # under modern setuptools (AttributeError: cython_sources). Keep the "legacy" stacks here focused
                    # on the scientific stack (numpy/pandas/scipy/anndata/networkx) and pin PyYAML>=6.
                    - python-version: "3.10"
                      dependency-set: "legacy stack (nx<3, yaml>=6, pandas<2, numpy<2)"
                      constraints: |
                          numpy<2
                          pandas<2
                          scipy<1.12
                          sparse<0.15
                          anndata<0.10
                          networkx<3
                          PyYAML>=6,<7
                    - python-version: "3.10"
                      dependency-set: "legacy stack (nx>=3, yaml>=6, pandas<2, numpy<2)"
                      constraints: |
                          numpy<2
                          pandas<2
                          scipy<1.12
                          sparse<0.15
                          anndata<0.10
                          networkx>=3,<4
                          PyYAML>=6,<7
                    - python-version: "3.10"
                      dependency-set: "pandas>=2 / numpy<2 (modern deps)"
                      constraints: |
                          numpy<2
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse<1
                          requests==2.32.4
                          urllib3==2.5.0
                    - python-version: "3.10"
                      dependency-set: "pandas>=2 / numpy>=2 (modern deps)"
                      constraints: |
                          numpy>=2,<3
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse>=0.15,<1
                          requests==2.32.4
                          urllib3==2.5.0

                    # -------------------------------------------------------------------------
                    # Python 3.11
                    # -------------------------------------------------------------------------
                    - python-version: "3.11"
                      dependency-set: "legacy stack (nx<3, yaml>=6, pandas<2, numpy<2)"
                      constraints: |
                          numpy<2
                          pandas<2
                          scipy<1.12
                          sparse<0.15
                          anndata<0.10
                          networkx<3
                          PyYAML>=6,<7
                    - python-version: "3.11"
                      dependency-set: "legacy stack (nx>=3, yaml>=6, pandas<2, numpy<2)"
                      constraints: |
                          numpy<2
                          pandas<2
                          scipy<1.12
                          sparse<0.15
                          anndata<0.10
                          networkx>=3,<4
                          PyYAML>=6,<7
                    - python-version: "3.11"
                      dependency-set: "pandas>=2 / numpy<2 (modern deps)"
                      constraints: |
                          numpy<2
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse<1
                          requests==2.32.4
                          urllib3==2.5.0
                    - python-version: "3.11"
                      dependency-set: "pandas>=2 / numpy>=2 (modern deps)"
                      constraints: |
                          numpy>=2,<3
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse>=0.15,<1
                          requests==2.32.4
                          urllib3==2.5.0

                    # -------------------------------------------------------------------------
                    # Python 3.12+ – focus on modern stacks (older scientific wheels may not exist).
                    # -------------------------------------------------------------------------
                    - python-version: "3.12"
                      dependency-set: "pandas>=2 / numpy<2 (nx<3)"
                      constraints: |
                          numpy<2
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx<3
                          PyYAML>=6,<7
                          sparse<1
                    - python-version: "3.12"
                      dependency-set: "pandas>=2 / numpy<2 (nx>=3)"
                      constraints: |
                          numpy<2
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse<1
                    - python-version: "3.12"
                      dependency-set: "pandas>=2 / numpy>=2 (nx>=3)"
                      constraints: |
                          numpy>=2,<3
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse>=0.15,<1

                    # Python 3.13
                    - python-version: "3.13"
                      dependency-set: "pandas>=2 / numpy>=2 (nx<3)"
                      constraints: |
                          numpy>=2,<3
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx<3
                          PyYAML>=6,<7
                          sparse>=0.15,<1
                    - python-version: "3.13"
                      dependency-set: "pandas>=2 / numpy>=2 (nx>=3)"
                      constraints: |
                          numpy>=2,<3
                          pandas>=2,<3
                          anndata>=0.10,<0.12
                          networkx>=3,<4
                          PyYAML>=6,<7
                          sparse>=0.15,<1

        steps:
            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                  name: wheel
                  path: dist

            # Convert the multi-line YAML string into a real constraints file.
            - name: Write constraints file
              run: printf '%s\n' "${{ matrix.constraints }}" > constraints.txt

            # NOTE: No checkout is necessary here. We only install the built wheel artifact.
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
                  cache: pip
                  cache-dependency-path: |
                      constraints.txt

            - name: Upgrade pip
              run: python -m pip install --upgrade pip

            # Install with constraints and verify the resolved environment is consistent.
            - name: Install wheel and verify dependencies
              run: |
                  python -m pip install -c constraints.txt dist/*.whl
                  python -m pip check

            - name: Import idtrack
              run: python -c "import idtrack; print(idtrack.__version__)"
