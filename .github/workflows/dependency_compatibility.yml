# CI: Dependency compatibility checks.
#
# This workflow builds a wheel once, then installs it against multiple
# "dependency stacks" using pip constraints. This is a cheap way to detect
# dependency resolver conflicts and missing upper/lower bounds.
#
# Parallelism:
# - The `install` job uses a matrix so each (python, constraint-set) pair runs
#   as a separate job => parallelism on GitHub runners.
name: Dependency Compatibility

on:
    push:
    pull_request:
    workflow_dispatch:

# Default permissions for the GITHUB_TOKEN (principle of least privilege).
permissions:
    contents: read

# Cancel older runs for the same branch/PR to reduce CI queue time and avoid wasting minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build-wheel:
        name: Build wheel
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      poetry.lock

            - name: Upgrade pip and install build tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build

            - name: Build wheel
              run: python -m build --wheel

            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                  name: wheel
                  path: dist/*.whl

    install:
        name: Install (${{ matrix.python-version }} / ${{ matrix.dependency-set }})
        needs: build-wheel
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        strategy:
            # Do not cancel the whole matrix if a single entry fails.
            fail-fast: false
            matrix:
                include:
                    # Each stack runs on Python 3.12 (oldest supported) and on the newest Python it supports.
                    # -------------------------------------------------------------------------
                    # Oldest stack: every floor of pyproject.toml at once. h5py 3.11 has no wheels after Python 3.12.
                    # -------------------------------------------------------------------------
                    - python-version: "3.12"
                      dependency-set: "oldest stack (every floor)"
                      constraints: |
                          pandas==2.3.0
                          anndata==0.13.0
                          numpy==2.1.0
                          scipy==1.14.0
                          h5py==3.11.0
                          networkx==3.2
                          sparse==0.15.0
                          PyYAML==6.0.2
                          requests==2.33.0
                          urllib3==2.8.0
                          PyMySQL==1.1.1
                          PySocks==1.7.1
                          tqdm==4.66.3
                    # -------------------------------------------------------------------------
                    # pandas 2.3 with everything else newest. pandas 2.3 has no wheels after Python 3.14.
                    # -------------------------------------------------------------------------
                    - python-version: "3.12"
                      dependency-set: "pandas 2.3, rest newest"
                      constraints: |
                          pandas>=2.3,<2.4
                    - python-version: "3.14"
                      dependency-set: "pandas 2.3, rest newest"
                      constraints: |
                          pandas>=2.3,<2.4
                    # -------------------------------------------------------------------------
                    # Newest stack: the newest release of everything, pandas 3.x.
                    # -------------------------------------------------------------------------
                    - python-version: "3.12"
                      dependency-set: "newest stack (pandas 3)"
                      constraints: |
                          pandas>=3
                    - python-version: "3.15"
                      dependency-set: "newest stack (pandas 3)"
                      constraints: |
                          pandas>=3

        steps:
            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                  name: wheel
                  path: dist

            # Convert the multi-line YAML string into a real constraints file.
            - name: Write constraints file
              run: printf '%s\n' "${{ matrix.constraints }}" > constraints.txt

            # NOTE: No checkout of the package is needed here (only the built wheel is installed); the Python 3.15
            # entry checks out the HDF5 build script alone, into _repo.
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  allow-prereleases: true
                  cache: pip
                  cache-dependency-path: |
                      constraints.txt

            - name: Upgrade pip
              run: python -m pip install --upgrade pip

            # h5py has no wheels for Python 3.15 yet (h5py 3.16.0, November 2026), so pip builds it from source. It is
            # built against the HDF5 that the h5py wheels of the other Python versions bundle (h5py 3.16.0: HDF5 2.0.0;
            # update both together), not ubuntu-22.04's libhdf5-dev (1.10, which cannot read caches that idtrack 0.0.5
            # wrote with the HDF5 1.14 of its wheels), so that this job tests the same library as the others. Remove
            # these steps once h5py publishes cp315 wheels.
            - name: Check out the HDF5 build script (Python 3.15 only)
              if: matrix.python-version == '3.15'
              uses: actions/checkout@v4
              with:
                  path: _repo
                  sparse-checkout: .github/scripts

            - name: Restore the HDF5 build (Python 3.15 only)
              if: matrix.python-version == '3.15'
              uses: actions/cache@v4
              with:
                  path: ~/hdf5-2.0.0
                  key: hdf5-2.0.0-${{ runner.os }}-ubuntu-22.04-${{ hashFiles('_repo/.github/scripts/build_hdf5.sh') }}

            - name: Build HDF5 2.0.0 (Python 3.15 only)
              if: matrix.python-version == '3.15'
              run: bash _repo/.github/scripts/build_hdf5.sh 2.0.0 "$HOME/hdf5-2.0.0"

            # Install with constraints and verify the resolved environment is consistent.
            - name: Install wheel and verify dependencies
              run: |
                  python -m pip install -c constraints.txt dist/*.whl
                  python -m pip check

            - name: Import idtrack
              run: python -c "import idtrack; print(idtrack.__version__)"
