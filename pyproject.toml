[tool.poetry]
name = "idtrack"
version = "0.0.5"
description = "Cross-Temporal and Cross-Database Biological Identifier Mapping."
authors = ["Kemal Inecik <k.inecik@gmail.com>"]
license = "BSD-3-Clause"
readme = "README.rst"
homepage = "https://github.com/theislab/idtrack"
repository = "https://github.com/theislab/idtrack"
documentation = "https://idtrack.readthedocs.io"
packages = [
    { include = "idtrack" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # Poetry adds one classifier per Python version from the `python` constraint below.
]


[tool.poetry.dependencies]
python = ">=3.12,<3.16"
# Floors: the oldest release that has Python 3.12 wheels, is at most about three years old (November 2026) and
# passes the test suite together with the other floors (the "oldest stack" of the dependency-compatibility
# workflow), unless a reason is given. No floor may name a release that cannot be installed on Python 3.12.
pandas = ">=2.3"  # supported from 2.3 and on 3.x; anndata 0.13 requires pandas>=2.3
anndata = ">=0.13"  # July 2026; the first anndata that writes .h5ad files with pandas 3
numpy = ">=2.1"  # August 2024; anndata 0.13 requires numpy>=2.1
scipy = ">=1.14"  # June 2024; anndata 0.13 requires scipy>=1.14 (and not 1.17.0)
h5py = ">=3.11"  # April 2024; anndata 0.13 requires h5py>=3.11
networkx = ">=3.2"  # October 2023
sparse = ">=0.15"  # January 2024
PyYAML = ">=6.0.2,<7"  # August 2024; 6.0.1 (July 2023) is older than three years
requests = ">=2.33.0"  # fixes CVE-2024-47081 and CVE-2026-25645
urllib3 = ">=2.8.0"  # fixes CVE-2025-50181/50182 and CVE-2026-44431/44432/97687/97688/97689 (add this line explicitly)
PyMySQL = ">=1.1.1"  # May 2024; fixes CVE-2024-36039
PySocks = ">=1.7.1"  # the last release (2019), pure Python; no newer release exists
tqdm = ">=4.66.3"  # May 2024; fixes CVE-2024-34062

# Optional dependencies for _external_mappers package
gget = {version = ">=0.28", optional = true}
pybiomart = {version = ">=0.2", optional = true}
gprofiler-official = {version = ">=1.0", optional = true}
mygene = {version = ">=3.2", optional = true}
biopython = {version = ">=1.81", optional = true}  # the oldest with Python 3.12 wheels
torch = {version = ">=2.2", optional = true}  # the oldest with Python 3.12 wheels
transformers = {version = ">=4.36", optional = true}  # the oldest checked that installs on Python 3.12

[tool.poetry.extras]
# External ID mapping backends (gget, pybiomart, gprofiler, mygene)
external-mappers = ["gget", "pybiomart", "gprofiler-official", "mygene"]
# Ortholog utilities (requires gget and biopython)
ortholog = ["gget", "biopython"]
# Protein embeddings for ortholog features (requires torch and transformers)
embeddings = ["torch", "transformers"]
# All external mapper features
all-external = ["gget", "pybiomart", "gprofiler-official", "mygene", "biopython", "torch", "transformers"]

[tool.poetry.group.dev.dependencies]
click = ">=8.0.0"
rich = ">=10.3.0"
pytest = ">=6.2.3"
pytest-xdist = ">=2.5.0"  # Parallel test execution
pytest-mock = ">=3.6.0"  # Better mocking utilities
pytest-cov = ">=3.0.0"  # Coverage integration with pytest
pytest-timeout = ">=2.1.0"  # Test timeouts
coverage = {extras = ["toml"], version = ">=5.3"}
safety = ">=2,<4"
typeguard = ">=2.12.0"
xdoctest = {extras = ["colors"], version = ">=0.15.0"}
sphinx = ">=4.0.2"
sphinx-autobuild = ">=2021.3.14"
pre-commit = ">=2.11.1"
flake8 = ">=3.8.4"
black = ">=20.8b1"
flake8-bandit = ">=2.0.0"
flake8-bugbear = ">=21.4.3"
flake8-docstrings = ">=1.5.0"
flake8-rst-docstrings = ">=0.2.3"
pep8-naming = ">=0.11.1"
darglint = ">=1.5.8"
pre-commit-hooks = ">=4.0.1"
sphinx-rtd-theme = ">=0.5.0"
sphinx-click = ">=3.0.0"
Pygments = ">=2.8.1"
# types-pkg-resources, which was unceremoniously disappeared from the Python supply chain. instead `types-setuptools`
types-setuptools = ">=71.1.0"
types-requests = ">=2.25.2"
types-attrs = ">=19.1.0"
sphinx-rtd-dark-mode = ">=1.2.3"
Jinja2 = ">=3.0.1"
mypy = ">=0.910"
nox = ">=2022.1.0"
nox-poetry = ">=1.0.0"
pyupgrade = ">=2.31.0"
bandit = ">=1.7.4"
flake8-builtins = ">=1.5.3"
flake8-colors = ">=0.1.9"
nbsphinx = ">=0.9.8"
sphinx-design = ">=0.3.0"
types-PyMySQL = ">=1.0.19"
types-PyYAML = ">=6.0.11"
ipython = ">=8.4.0"
isort = ">=5.12.0"
poetry-plugin-export = ">=1.8"

[tool.poetry.scripts]
idtrack = "idtrack.__main__:main"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
skip = ["docs/_logo"]

[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
ignore_missing_imports = true

[tool.coverage.paths]
source = ["idtrack", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["idtrack"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 60  # Minimum coverage threshold
skip_covered = false
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (skipped by default; pass --runslow to run)",
    "integration: marks tests as integration tests requiring external resources",
    "network: marks tests requiring network access",
    "database: marks tests requiring database connection",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
